url: https://plantedml.com/randomPlantedForest/
template:
  bootstrap: 5
  light-switch: true

development:
  mode: auto

reference:
- title: Model fitting and prediction
  desc: >
    Modeling fundamentals for creation and prediction from Random Planted
    Forest models.
- contents:
  - rpf
  - predict.rpf
  - oob_path_checkpoints

- title: Tuning
  desc: Tuning the greediness and the leaf size out of bag
- contents:
  - tune_control
  - greediness_ladder

- title: Functional decomposition
  desc: Enabling and utilizing functional decomposition
- contents:
    - purify
    - predict_components

- title: Pruning
  desc: Dropping small components, chosen by cross-validation or out of bag
- contents:
  - prune_components
  - predict.rpf_pruned

- title: Visualization
  desc: Inspecting the trees of a forest
- contents:
    - plot.rpf
    - rpf_boxes
- text: -------
- title: Utility functions
- contents:
  - starts_with("print.")
  - starts_with("str.")
  - rpf_marshal
  - rpf_is_valid
  - bundle.rpf
